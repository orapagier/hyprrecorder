[package]
name = "hyprrecorder"
version = "0.1.0"
edition = "2021"
rust-version = "1.86"
description = "A focused Wayland screen recorder for the Hyprshell desktop"
publish = false

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"

[profile.release]
lto = "thin"
codegen-units = 1
strip = true
