[package]
name = "hyprrecorder"
version = "0.1.0"
edition = "2021"
rust-version = "1.86"
description = "A focused Wayland screen recorder for the Hyprshell desktop"
publish = false
license = "MIT"

[features]
recorder = ["gpu-encode-spike"]
desktop = ["recorder"]
portal-spike = ["dep:libc"]
gpu-encode-spike = ["dmabuf-spike"]
dmabuf-spike = ["capture-spike"]
capture-spike = ["dep:wayland-protocols-wlr", "dep:wayland-protocols", "dep:memmap2", "dep:libc"]

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
wayland-client = "0.31.15"
wayland-protocols-wlr = { version = "0.3.12", features = ["client"], optional = true }
wayland-protocols = { version = "0.32.13", features = ["client", "staging"], optional = true }
memmap2 = { version = "0.9.11", optional = true }
libc = { version = "0.2", optional = true }

[build-dependencies]
cc = "1"
pkg-config = "0.3"

[profile.release]
lto = "thin"
codegen-units = 1
strip = true
